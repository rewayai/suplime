# pyannote.database configuration for the suplime training recipe.
#
# Copy to training/database.yml and replace /DATA with your corpus root. Every corpus has:
#   audio/<uri>.wav          16 kHz mono WAV (see training/README.md for the channel used)
#   rttm/<uri>.rttm          reference speaker turns
#   uem/<uri>.uem            scored region (whole file if the corpus defines none)
# URI lists (one uri per line) live next to the audio: /DATA/<corpus>/lists/{train,dev}.txt.
# Train = the corpus' official training split; development = held-out files of your choice,
# not used for training. RESEARCH-ONLY: RAMC, MSDWild and AVA-AVD are non-commercial and
# AISHELL-4 / AliMeeting are share-alike; a model trained on them inherits those terms.

Databases:
  AMI:         /DATA/AMI/audio/{uri}.wav
  ICSI:        /DATA/ICSI/audio/{uri}.wav
  VoxConverse: /DATA/VoxConverse/audio/{uri}.wav
  CHiME6:      /DATA/CHiME6/audio/{uri}.wav
  DiPCo:       /DATA/DiPCo/audio/{uri}.wav
  NOTSOFAR1:   /DATA/NOTSOFAR1/audio/{uri}.wav
  AISHELL4:    /DATA/AISHELL4/audio/{uri}.wav
  AMI_SDM:     /DATA/AMI_SDM/audio/{uri}.wav
  AVA_AVD:     /DATA/AVA_AVD/audio/{uri}.wav
  AliMeeting:  /DATA/AliMeeting/audio/{uri}.wav
  MSDWild:     /DATA/MSDWild/audio/{uri}.wav
  RAMC:        /DATA/RAMC/audio/{uri}.wav

# One protocol per corpus: `train` is the corpus' training split, `development` a small
# held-out subset of your choice (/DATA/<corpus>/lists/dev.txt).
Protocols:
  AMI:
    SpeakerDiarization:
      suplime:
        train:
          uri: /DATA/AMI/lists/train.txt
          annotation: /DATA/AMI/rttm/{uri}.rttm
          annotated: /DATA/AMI/uem/{uri}.uem
        development:
          uri: /DATA/AMI/lists/dev.txt
          annotation: /DATA/AMI/rttm/{uri}.rttm
          annotated: /DATA/AMI/uem/{uri}.uem
  ICSI:
