  # The meta-protocol suplime-train uses: all 12 training splits, all 12 development subsets.
  X:
    SpeakerDiarization:
      TrainAllExt2:
        train:
          AMI.SpeakerDiarization.suplime: [train]
          ICSI.SpeakerDiarization.suplime: [train]
